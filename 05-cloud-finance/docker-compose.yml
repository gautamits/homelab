services:
  nextcloud:
    image: nextcloud:stable
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /media/amit/data/containers/nextcloud/config:/var/www/html
      - /media/amit/data/containers/nextcloud/data:/var/www/html/data
    networks:
      - proxy-tier

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    ports:
      - "${PAPERLESS_PORT:-8010}:8000"
    volumes:
      - /media/amit/data/containers/paperless/data:/usr/src/paperless/data
      - /media/amit/data/containers/paperless/media:/usr/src/paperless/media
      - /media/amit/data/containers/paperless/export:/usr/src/paperless/export
      - /media/amit/data/containers/paperless/consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=${PAPERLESS_URL}
      - USER_TZ=${TZ:-Asia/Kolkata}
    networks:
      - proxy-tier

  actual-budget:
    image: ghcr.io/actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - /media/amit/data/containers/actual-budget:/data
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
